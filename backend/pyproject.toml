[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "orvia-backend"
version = "0.1.0"
description = "序航 Orvia 本地 stdio 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "jieba>=0.42,<1",
    "langgraph>=0.6,<1",
    "langgraph-checkpoint-sqlite>=2,<3",
    "playwright>=1.58,<2",
    "trafilatura>=2,<3",
    "psutil>=7.0,<8",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/orvia_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
